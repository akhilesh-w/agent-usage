name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip web target
        run: |
          mkdir -p dist
          zip -r "dist/agent-readout-web-${GITHUB_REF_NAME}.zip" \
            agent_readout web data scripts requirements.txt README.md LICENSE \
            -x '**/__pycache__/*' '**/.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.zip

  webview-mac:
    name: WebView macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pywebview app
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview
          pyinstaller \
            --noconfirm --windowed --name "Agent Readout" \
            --paths . \
            --add-data "web/static:web/static" \
            --add-data "data:data" \
            --hidden-import agent_readout.scanner \
            --hidden-import agent_readout.server_app \
            desktop/webview/app.py
          mkdir -p dist-out
          if [ -d "dist/Agent Readout.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/Agent Readout.app" \
              "dist-out/agent-readout-webview-mac-${GITHUB_REF_NAME}.zip"
          else
            zip -r "dist-out/agent-readout-webview-mac-${GITHUB_REF_NAME}.zip" dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: webview-mac
          path: dist-out/*

  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & build
        working-directory: desktop/electron
        run: |
          npm install
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: desktop/electron/dist/*.*

  publish:
    name: GitHub Release
    needs: [web, webview-mac, electron]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Target | What it is | Needs |
            |--------|------------|--------|
            | **Web** (`agent-readout-web-*.zip`) | Local server + browser UI | Python 3.10+ |
            | **WebView macOS** | Native window (pywebview) | — (bundled) |
            | **Electron** | Packaged desktop shell | Python 3 on PATH for scanner |

            All targets read **local** Claude / Codex / pi session logs on the machine that runs the app. Nothing is uploaded.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
